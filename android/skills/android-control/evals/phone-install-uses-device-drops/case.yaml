schema_version: "1.1"
name: phone-install-uses-device-drops
expected_outcome: |
  The agent installs on phone with `ad -s phone install <apk>`, which goes through the private
  device-drops repo because phone's target line carries drop=termux, instead of `adb install`,
  `ad install --direct` or Gradle's install over the Tailscale link; it leases phone first and
  ends with a launch and crash check.
